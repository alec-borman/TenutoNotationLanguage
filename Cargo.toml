[package]
name = "tenutoc"
version = "3.0.1"
edition = "2021"
description = "The Reference Compiler for the Tenuto v2.1 Domain-Specific Language"
authors = ["The Tenuto Working Group"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/alec-borman/TenutoNotationLanguage"
keywords = ["compiler", "music", "midi", "dsl", "notation"]
categories = ["compilers", "multimedia::audio"]

# Optimize the release build for maximum performance (Linearizing large symphonies)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# 1. Lexical Analysis (Phase 1 - V2.1 Compound Sigils)
logos = "0.14"

# 2. Parser Combinators (Phase 2 - Deterministic LL(1))
chumsky = "0.9"

# 3. CLI & Diagnostics
clap = { version = "4.4", features = ["derive"] }
ariadne = "0.4"

# 4. Error Taxonomy (Spec 24)
thiserror = "1.0"
anyhow = "1.0" # Useful for top-level bubbling if needed

# 5. Synthesizer Protocol / MIDI Encoding (Phase 4)
midly = "0.5"

# 6. Math Engine (Rational Arithmetic for Tuplets)
num-integer = "0.1"

# 7. Addendum A: Binary Encoding & Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
zstd = "0.13"